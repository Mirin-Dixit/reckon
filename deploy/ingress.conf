worker_processes 1;
pid /tmp/nginx.pid;
# Nginx error messages can contain raw request URIs; use health/HTTP errors.
error_log /dev/null;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 30s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header Forwarded "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Host 127.0.0.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 180s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    server { listen 8080 default_server; server_name _; return 403; }
    server {
        listen 8080;
        server_name 127.0.0.1;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        error_page 502 504 =503 /upstream-unavailable;
        location = /upstream-unavailable {
            internal;
            default_type application/json;
            return 503 '{"error":{"code":"local_service_unavailable","message":"A local service is unavailable. Check container health.","execution_status":null}}';
        }
        location /api/ {
            proxy_pass http://backend:8080;
        }
        location / {
            proxy_pass http://backend:8080;
        }
    }
}
