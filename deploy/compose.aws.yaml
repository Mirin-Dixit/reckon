# AWS EC2 Docker Compose Override for Reckon
#
# Usage:
#   docker compose -f compose.yaml -f deploy/compose.aws.yaml up -d
#
# Design Goals:
# 1. Daemon restart resilience: 'unless-stopped' ensures services recover after reboot.
# 2. Host storage protection: json-file log rotation prevents unconstrained disk consumption.
# 3. Security posture: Gateway port binding remains pinned strictly to loopback (127.0.0.1:3000:8080).
# 4. Host networking: Maintains host-gateway mapping for Ollama communication on Linux.

services:
  backend:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      RECKON_ENV: "production"
      RECKON_LOG_LEVEL: "INFO"
      RECKON_CORS_ORIGINS: "http://127.0.0.1:3000"

  frontend:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:8080"

  app-proxy:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
