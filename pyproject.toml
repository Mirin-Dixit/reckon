
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbench-studio"
version = "0.1.0"
description = "A workbench for evaluating retrieval strategies in retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
server = [
    "uvicorn>=0.30,<1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "httpx>=0.27",
    "uvicorn>=0.30,<1",
]
openai = [
    "openai>=1.66.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

